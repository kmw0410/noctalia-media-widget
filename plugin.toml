id = "kmw0410/media-player"
name = "Media Player"
version = "0.1.1"
plugin_api = 24
author = "kmw0410"
license = "MIT"
dependencies = ["playerctl"]
tags = ["desktop", "media", "music", "video"]
icon = "player-play"
description = "A compact MPRIS desktop media player without album artwork."

[[desktop_widget]]
id = "compact_media_player"
entry = "media_widget.luau"

[[desktop_widget.setting]]
key = "show_progress"
type = "bool"
label_key = "settings.show_progress.label"
description_key = "settings.show_progress.description"
default = true

[[desktop_widget.setting]]
key = "show_shadow"
type = "bool"
label_key = "settings.show_shadow.label"
description_key = "settings.show_shadow.description"
default = true

[[desktop_widget.setting]]
key = "hide_when_idle"
type = "bool"
label_key = "settings.hide_when_idle.label"
description_key = "settings.hide_when_idle.description"
default = false
